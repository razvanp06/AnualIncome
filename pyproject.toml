[project]
name = "anual-income"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "razvanp06", email = "pica.razvan30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
anual-income = "anual_income:main"

[build-system]
